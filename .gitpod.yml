image:
  file: .gitpod/Dockerfile

vscode:
  extensions:
    - betterthantomorrow.calva
    - djblue.portal

ports:
  - port: 5900
    onOpen: ignore
  - port: 6080
    onOpen: ignore
  - port: 6003
    onOpen: ignore
  - port: 3000
    onOpen: ignore
  - port: 3001
    onOpen: ignore
    
tasks:
  - name: Install NPM dependencies
    command: yarn install
  - name: Polylith Real World nREPL Server
    command: npx shadow-cljs -d cider/cider-nrepl:0.47.1 -d zprint:0.4.16 watch realworld-frontend test
  - name: Open Getting Started
    command: code development/src/dev/getting_started.clj
  - name: poly shell
    command: clojure -M:poly
